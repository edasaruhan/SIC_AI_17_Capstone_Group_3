name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/py312-dev.txt

      - name: Install project and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312-dev.txt -e ".[graph,app,dev]"

      - name: Lint and verify formatting
        run: |
          python -m ruff check --no-cache src scripts tests app.py
          python -m ruff format --no-cache --check src scripts tests app.py

      - name: Test with coverage floor
        run: >-
          python -m pytest -q
          --cov=argus
          --cov-report=term-missing
          --cov-fail-under=77

      - name: Verify dependency consistency
        run: python -m pip check
