[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-ai"
version = "0.1.0"
description = "Leakage-safe transaction and account-network research prototype for financial-crime investigation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Gizem Özcan"},
  {name = "Ayşe Ulaşlı"},
]
dependencies = [
  "duckdb>=1.5,<2",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
graph = [
  "torch>=2.4,<3",
]
app = [
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
