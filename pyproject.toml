[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-ai"
version = "0.1.0"
description = "Leakage-safe data and graph foundations for financial-crime investigation research."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "ARGUS AI Capstone Team"},
]
dependencies = [
  "duckdb>=1.5,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pytest's cache finalizer can block indefinitely in this OneDrive-backed
# workspace. Disabling that non-essential plugin keeps the plain `pytest`
# command deterministic; test execution and reporting are unchanged.
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
